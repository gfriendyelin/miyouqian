name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean MiyoQian-Windows.spec
      - name: Prepare config
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MiyoQian/config.yaml")) {
            Copy-Item "config.example.yaml" "dist/MiyoQian/config.yaml"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MiyoQian-Windows-x64
          path: dist/MiyoQian/
          if-no-files-found: error
